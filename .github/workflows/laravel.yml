name: Laravel CI

on:
  push:
    branches: [ "feature/tests", "develop", "main" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --working-dir=rezervacijeapi
    - name: Copy .env
      run: cp rezervacijeapi/.env.example rezervacijeapi/.env
    - name: Generate key
      run: php rezervacijeapi/artisan key:generate
    - name: Run Tests
      working-directory: rezervacijeapi
      run: php rezervacijeapi/artisan test
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: testing
        DB_USERNAME: root
        DB_PASSWORD: root